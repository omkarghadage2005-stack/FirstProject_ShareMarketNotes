<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Trading Notes</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    margin:0;
    padding:0;
}
.contact{
    max-width:600px;
    margin:80px auto;
    background:#111827;
    padding:30px;
    border-radius:12px;
    text-align:center;
}
.contact h1{
    color:#38bdf8;
}
.contact p{
    color:#cbd5f5;
    margin-bottom:30px;
}

.social-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.social-buttons a{
    text-decoration:none;
    padding:15px 25px;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
    color:#fff;
    transition:0.3s;
}

.instagram{
    background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
}
.instagram:hover{
    opacity:0.85;
}

.whatsapp{
    background:#25D366;
}
.whatsapp:hover{
    background:#1ebe57;
}

footer{
    margin-top:30px;
    font-size:14px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="contact">
    <h1>Contact Us</h1>
    <p>Connect with us directly on Instagram or WhatsApp for queries and support.</p>

    <div class="social-buttons">
        <!-- Instagram -->
        <a href="https://www.instagram.com/your_instagram_id" 
           target="_blank" 
           class="instagram">
           📸 Instagram
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/919876543210" 
           target="_blank" 
           class="whatsapp">
           💬 WhatsApp
        </a>
    </div>

    <footer>
        © 2026 Trading Notes | Educational Purpose Only
    </footer>
</div>

</body>
</html>
