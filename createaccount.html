<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Trending Notes</title>
    <link rel="stylesheet" href="createaccount.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="signup-container">
        <div class="signup-image">
            <div class="overlay-text">
                <h1>OutStanging Mingset</h1>
                <p> TREADING NOTS: Capture, share, and discover the most popular notes from around the world.</p>
            </div>
        </div>
        <div class="signup-form-section">
            <div class="form-wrapper">
                <h2>Create an account</h2>
                <p class="subtitle">Join the community of note-takers today.</p>
                
                <form id="signup-form">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>
                    
                    <button type="submit" class="btn-primary"><a href="login_page.html"></a>sign Up</button>
                </form>
                
                <div class="social-signup">
                    <p>Or sign up with</p>
                    <div class="social-buttons">
                        <button class="btn-social">Google</button>
                        <button class="btn-social">GitHub</button>
                    </div>
                </div>
                
                <p class="login-link">Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
