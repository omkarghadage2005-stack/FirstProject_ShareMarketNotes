<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live BANK NIFTY Data</title>
 <link rel="stylesheet" href="banknifty.css">
</head>
<a href="home_page.html" class="back-btn">⬅ Back</a>
<body>
    <h1>🏦 Live BANK NIFTY Data</h1>
    <div class="widget-box">
        <div class="tradingview-widget-container">
        <div id="tradingview_banknifty"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({
                "width": "100%",
                "height": 500,
                "symbol": "NSE:BANKNIFTY",
                "interval": "5",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": false,
                "container_id": "tradingview_banknifty"
                });
            </script>
        </div>
    </div>
    <div class="footer">
        Live Data Source: TradingView | NSE India
    </div>
</body>
</html>
